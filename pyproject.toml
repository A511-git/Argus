[project]
name = "argus"
version = "0.0.1"
requires-python = ">= 3.10"
authors = [{name = "Xi Li", email = "xi-li@foxmail.com"}]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "huggingface_hub>=0.20.0",
    "einops>=0.7.0",
    "safetensors>=0.4.0",
    "opencv-python>=4.7.0",
    "scipy>=1.10.0",
    "trimesh>=4.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
demo = [
    "gradio>=4.0.0",
    "matplotlib>=3.7.0",
    "viser>=0.2.0",
]
eval = [
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "open3d>=0.17.0",
    "kornia>=0.7.0",
]
splat = [
    "plyfile>=1.0.0",
    "openexr>=3.0.0",
]
all = [
    "argus[demo,eval,splat]",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus*"]
